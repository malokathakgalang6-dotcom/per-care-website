<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enroll - Per Care</title>
</head>

<body>

    <header>
        <h1>Per Care and Training Academy</h1>
        <nav>
            <a href="index.html">Home</a> |
            <a href="courses.html">Courses</a> |
            <a href="my-courses.html">My Courses</a> |
            <a href="support.html">Support</a>
        </nav>
    </header>

    <main>
        <h2>Enroll in Course</h2>

        <h3>Caregiver Training</h3>
        <p>Duration: 4 Weeks | Online / Onsite | Certificate</p>
        <p><strong>Price: R 1 250.00</strong></p>

        <h3>Your Details</h3>
        <form action="my-courses.html" method="get">
            <p>
                <label for="fullname">Full Name:</label><br>
                <input type="text" id="fullname" name="fullname" required>
            </p>
            <p>
                <label for="email">Email Address:</label><br>
                <input type="email" id="email" name="email" required>
            </p>
            <p>
                <label for="phone">Phone Number:</label><br>
                <input type="tel" id="phone" name="phone" required>
            </p>

            <h3>Payment Method</h3>
            <p>
                <input type="radio" id="card" name="payment" value="card" checked>
                <label for="card">Credit / Debit Card</label>
            </p>
            <p>
                <input type="radio" id="eft" name="payment" value="eft">
                <label for="eft">EFT / Bank Transfer</label>
            </p>
            <p>
                <input type="radio" id="cash" name="payment" value="cash">
                <label for="cash">Pay at Campus</label>
            </p>

            <p>
                <button type="submit">Confirm Enrollment</button>
            </p>
        </form>
    </main>

    <footer>
        <p>&copy; 2026 Per Care and Training Academy</p>
    </footer>

</body>

</html>
